name: Weekly Calibration

on:
  schedule:
    - cron: '0 1 * * 1'  # Monday 10:00 JST
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx supabase

      - name: Run calibration and apply
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python packages/scanner/calibrate.py --apply

      - name: Commit updated weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/scoring/weights.json
          git diff --cached --quiet || git commit -m "Auto-calibrate weights [skip ci]"
          git push

      - name: Upload calibration report
        uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ github.run_number }}
          path: packages/scanner/data/calibration_*.json
          retention-days: 365
