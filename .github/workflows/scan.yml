name: Daily Scan

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run scan
        run: python packages/scanner/scanner_v2.py --limit 50

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_number }}
          path: packages/scanner/data/
          retention-days: 90
