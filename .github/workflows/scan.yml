name: Daily Scan

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - full
          - diff

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx supabase

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "full" ]; then
            python packages/scanner/scanner_v3.py --supabase --full
          elif [ "$MODE" = "diff" ]; then
            python packages/scanner/scanner_v3.py --supabase --diff
          else
            python packages/scanner/scanner_v3.py --supabase
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ github.run_number }}
          path: packages/scanner/data/
          retention-days: 90

      - name: Trigger site rebuild
        run: |
          git config user.name "ToolRank Bot"
          git config user.email "bot@toolrank.dev"
          git commit --allow-empty -m "Trigger rebuild after scan"
          git push
