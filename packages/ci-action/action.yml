name: 'ToolRank Score'
description: 'Score MCP tool definitions on every PR. Posts ToolRank Score as a PR comment with fix suggestions.'
author: 'ToolRank (imhiroki)'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  path:
    description: 'Path to MCP tool definition file (auto-detected if empty)'
    required: false
    default: ''
  min-score:
    description: 'Minimum ToolRank Score to pass (0-100)'
    required: false
    default: '0'
  fail-on-low:
    description: 'Fail the check if score is below min-score'
    required: false
    default: 'false'
  comment:
    description: 'Post score as PR comment'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Average ToolRank Score'
  level:
    description: 'Score level (Dominant/Preferred/Selectable)'
  passed:
    description: 'Whether score meets min-score threshold'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install & Score
      shell: bash
      id: score
      run: |
        pip install httpx -q
        curl -sL https://raw.githubusercontent.com/imhiroki/toolrank/v1.0.0/packages/scoring/toolrank_score.py -o /tmp/toolrank_score.py
        python3 << 'PYEOF'
        import json, sys, glob, os
        sys.path.insert(0, '/tmp')
        from toolrank_score import score_server, to_json
        path = os.environ.get('INPUT_PATH', '')
        min_score = float(os.environ.get('INPUT_MIN_SCORE', '0'))
        files = [path] if path else []
        if not files:
            for p in ['**/mcp.json','**/tools.json','**/server.json']:
                files.extend(glob.glob(p, recursive=True))
        if not files:
            with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write("score=skip\npassed=true\nlevel=N/A\n")
            open('/tmp/toolrank-comment.md','w').write("")
            sys.exit(0)
        all_results = []
        for fp in files:
            try:
                data = json.load(open(fp))
                tools = data.get('tools', [data] if 'name' in data else [])
                if tools: all_results.append((fp, to_json(score_server(fp, tools))))
            except: pass
        if not all_results:
            with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write("score=skip\npassed=true\nlevel=N/A\n")
            open('/tmp/toolrank-comment.md','w').write("")
            sys.exit(0)
        lines = ["## <img src='https://toolrank.dev/badge/dominant.svg' height='20'/> ToolRank Score Report\n"]
        scores = []
        for fp, r in all_results:
            avg = r['average_score']; scores.append(avg)
            pct = 3 if avg>=95 else 10 if avg>=90 else 36 if avg>=85 else 55 if avg>=80 else 75 if avg>=70 else 92
            lv = 'Dominant' if avg>=85 else 'Preferred' if avg>=70 else 'Selectable' if avg>=50 else 'Needs work'
            em = '🟣' if avg>=85 else '🟢' if avg>=70 else '🟡' if avg>=50 else '🔴'
            lines.append(f"### {em} `{fp}` — **{round(avg)}/100** ({lv}, top {pct}%)\n")
            lines.append("| Tool | Score | F | C | P | E |")
            lines.append("|------|-------|---|---|---|---|")
            for t in r['tools']:
                d=t['dimensions']
                lines.append(f"| `{t['name']}` | **{t['total_score']}** | {d['findability']} | {d['clarity']} | {d['precision']} | {d['efficiency']} |")
            issues = [(t['name'],i) for t in r['tools'] for i in t['issues']]
            if issues:
                lines.append("\n**Top issues:**")
                for n,i in issues[:3]: lines.append(f"- `{n}`: {i['message']} — _{i['fix']}_ (+{i['impact']}pt)")
            lines.append("")
        avg_all = sum(scores)/len(scores)
        passed = avg_all >= min_score or min_score == 0
        lv = 'Dominant' if avg_all>=85 else 'Preferred' if avg_all>=70 else 'Selectable' if avg_all>=50 else 'Low'
        lines.append("---")
        lines.append(f"<sub>Scored by [ToolRank](https://toolrank.dev) v1.0.0 · [Improve your score](https://toolrank.dev/score) · [Get badge](https://toolrank.dev/badge)</sub>")
        open('/tmp/toolrank-comment.md','w').write("\n".join(lines))
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"score={round(avg_all,1)}\nlevel={lv}\npassed={'true' if passed else 'false'}\n")
        if not passed and os.environ.get('INPUT_FAIL_ON_LOW','false')=='true':
            print(f"::error::Score {round(avg_all,1)} below {min_score}"); sys.exit(1)
        PYEOF
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_FAIL_ON_LOW: ${{ inputs.fail-on-low }}

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.score.outputs.score != 'skip'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/toolrank-comment.md','utf8');
          if (!body.trim()) return;
          const {data:comments} = await github.rest.issues.listComments({
            owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number});
          const existing = comments.find(c=>c.body.includes('ToolRank Score Report'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner:context.repo.owner, repo:context.repo.repo, comment_id:existing.id, body});
          } else {
            await github.rest.issues.createComment({
              owner:context.repo.owner, repo:context.repo.repo, issue_number:context.issue.number, body});
          }
